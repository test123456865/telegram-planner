<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Economic Calendar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0814;
    --surface: #14111F;
    --surface-2: #171420;
    --line: rgba(255,255,255,0.07);
    --text: #F4F2F9;
    --text-soft: #8D89A0;
    --text-faint: #625E75;
    --violet: #8B7CF6;
    --violet-dim: rgba(139,124,246,0.14);
    --violet-glow: rgba(139,124,246,0.45);
    --red: #F0475C;
    --red-bg: rgba(240,71,92,0.14);
    --orange: #F5A524;
    --orange-bg: rgba(245,165,36,0.16);
    --green: #22C55E;
    --green-bg: rgba(34,197,94,0.14);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100%;
  }

  body { padding-bottom: env(safe-area-inset-bottom); }

  svg { display: block; }

  /* ---------- Header ---------- */
  .header {
    position: relative;
    padding: 24px 18px 18px;
    text-align: center;
    overflow: hidden;
  }

  .glow {
    position: absolute;
    top: -60px;
    left: 50%;
    transform: translateX(-50%);
    width: 320px;
    height: 220px;
    background: radial-gradient(ellipse at center, var(--violet-glow) 0%, transparent 70%);
    opacity: 0.5;
    pointer-events: none;
  }

  .filter-btn {
    position: absolute;
    top: 22px;
    right: 18px;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(139,124,246,0.06);
    border: 1px solid rgba(139,124,246,0.35);
    color: var(--violet);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 14px;
    border-radius: 12px;
    cursor: pointer;
    z-index: 2;
  }

  .icon-box {
    position: relative;
    width: 68px;
    height: 68px;
    margin: 0 auto 16px;
    border-radius: 20px;
    background: linear-gradient(135deg, #9C7CF6 0%, #6D4FD6 100%);
    box-shadow: 0 10px 28px rgba(120,90,240,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }

  h1 {
    font-size: 25px;
    font-weight: 800;
    margin: 0 0 8px;
    letter-spacing: -0.3px;
    position: relative;
    z-index: 2;
  }

  .subtitle {
    font-size: 14px;
    color: var(--text-soft);
    margin: 0;
    position: relative;
    z-index: 2;
  }

  /* ---------- Day strip ---------- */
  .day-strip-wrap { padding: 18px 18px 0; }

  .day-strip {
    display: flex;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 14px 10px;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .day-strip::-webkit-scrollbar { display: none; }

  .day-cell {
    flex: 1 0 auto;
    min-width: 46px;
    background: none;
    border: 1.5px solid transparent;
    border-radius: 12px;
    padding: 8px 4px 9px;
    font-family: inherit;
    color: var(--text-soft);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
  }

  .day-cell .dow { font-size: 10.5px; font-weight: 600; letter-spacing: 0.3px; }
  .day-cell .date { font-size: 19px; font-weight: 800; color: var(--text); line-height: 1; }
  .day-cell .mon { font-size: 10.5px; color: var(--text-faint); }
  .day-cell .dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; margin-top: 1px; }

  .day-cell.selected {
    border-color: var(--violet);
    background: var(--violet-dim);
    box-shadow: 0 0 0 1px rgba(139,124,246,0.15), 0 0 18px rgba(139,124,246,0.25);
  }

  .day-cell.selected .dow,
  .day-cell.selected .mon { color: var(--violet); }
  .day-cell.selected .dot { background: var(--violet); }

  .day-jump {
    flex: 0 0 auto;
    width: 40px;
    height: 100%;
    min-height: 62px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-soft);
    cursor: pointer;
  }

  /* ---------- Filter chips ---------- */
  .chip-row {
    display: flex;
    gap: 8px;
    padding: 14px 18px 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .chip-row::-webkit-scrollbar { display: none; }

  .chip {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text-soft);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 10px 14px;
    border-radius: 12px;
    cursor: pointer;
    white-space: nowrap;
  }

  .chip .dot { width: 7px; height: 7px; border-radius: 50%; }
  .chip .dot.high { background: var(--red); }
  .chip .dot.medium { background: var(--orange); }
  .chip .dot.low { background: var(--green); }

  .chip.active {
    border-color: var(--violet);
    background: var(--violet-dim);
    color: var(--violet);
    box-shadow: 0 0 14px rgba(139,124,246,0.22);
  }

  .chip.active svg path,
  .chip.active svg rect,
  .chip.active svg line { stroke: var(--violet); }

  /* ---------- Table ---------- */
  .table-wrap { padding: 16px 18px 8px; }

  .table-head {
    display: flex;
    align-items: center;
    padding: 0 4px 10px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-faint);
    text-transform: none;
  }

  .table-head .col-time { flex: 0 0 78px; display: flex; align-items: center; gap: 5px; }
  .table-head .col-event { flex: 1; }
  .table-head .col-num { flex: 0 0 50px; text-align: right; }

  .rows {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 12px;
    border-bottom: 1px solid var(--line);
    position: relative;
  }

  .row:last-child { border-bottom: none; }

  .row::before {
    content: '';
    position: absolute;
    top: 8px;
    bottom: 8px;
    left: 0;
    width: 3px;
    border-radius: 3px;
    background: var(--bar-color, var(--text-faint));
  }

  .row.hidden { display: none; }

  .star-btn, .bell-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px;
    color: var(--text-faint);
    flex: 0 0 auto;
    display: flex;
  }

  .bell-btn { color: var(--violet); }
  .star-btn.active { color: var(--orange); }
  .bell-btn.muted { color: var(--text-faint); opacity: 0.4; }

  .time-col {
    flex: 0 0 62px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .time-col .time { font-size: 14px; font-weight: 700; }
  .time-col .ccy { font-size: 11.5px; color: var(--text-soft); display: flex; align-items: center; gap: 4px; }

  .event-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .event-col .name {
    font-size: 13.5px;
    font-weight: 700;
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .badges { display: flex; gap: 5px; flex-wrap: wrap; }

  .badge {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 7px;
    border-radius: 6px;
  }

  .badge.high { background: var(--red-bg); color: var(--red); }
  .badge.medium { background: var(--orange-bg); color: var(--orange); }
  .badge.low { background: var(--green-bg); color: var(--green); }
  .badge.period { background: rgba(255,255,255,0.06); color: var(--text-soft); }

  .num-col {
    flex: 0 0 46px;
    text-align: right;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text);
  }

  .num-col.dim { color: var(--text-faint); font-weight: 500; }
  .num-col.up { color: var(--green); }
  .num-col.down { color: var(--red); }

  /* ---------- Footer ---------- */
  .footer {
    margin: 18px 18px 24px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 12.5px;
  }

  .tz {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-soft);
  }

  .tz b { color: var(--violet); font-weight: 700; }

  .legend { display: flex; gap: 14px; }
  .legend-item { display: flex; align-items: center; gap: 5px; color: var(--text-soft); font-weight: 500; }
  .legend-item .dot { width: 7px; height: 7px; border-radius: 50%; }

  /* ---------- Sheet (Filter by currency) ---------- */
  .sheet-backdrop {
    position: fixed; inset: 0;
    background: rgba(5,4,10,0.6);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
    z-index: 10;
  }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-bottom: none;
    border-radius: 22px 22px 0 0;
    padding: 20px 18px calc(20px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(.32,.72,0,1);
    z-index: 11;
  }
  .sheet.open { transform: translateY(0); }

  .sheet-handle { width: 36px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 16px; }
  .sheet h2 { font-size: 16px; font-weight: 700; margin: 0 0 14px; }

  .ccy-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .ccy-opt {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text-soft);
    font-family: inherit; font-size: 13px; font-weight: 600;
    padding: 9px 13px; border-radius: 11px; cursor: pointer;
  }
  .ccy-opt.active { border-color: var(--violet); background: var(--violet-dim); color: var(--violet); }

  .sheet-close {
    width: 100%; padding: 13px; border-radius: 12px; border: none;
    background: var(--violet); color: #fff; font-family: inherit;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
</style>
</head>
<body>

  <div class="header">
    <div class="glow"></div>
    <button class="filter-btn" id="filterBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 5h16M7 12h10M10 19h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Filter
    </button>
    <div class="icon-box">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="3" stroke="white" stroke-width="1.8"/><path d="M3 9.5h18" stroke="white" stroke-width="1.8"/><path d="M8 3v3M16 3v3" stroke="white" stroke-width="1.8" stroke-linecap="round"/></svg>
    </div>
    <h1>Economic Calendar</h1>
    <p class="subtitle">Stay ahead of the market moving events</p>
  </div>

  <div class="day-strip-wrap">
    <div class="day-strip" id="dayStrip"></div>
  </div>

  <div class="chip-row" id="chipRow">
    <button class="chip active" data-filter="all">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="3" stroke="currentColor" stroke-width="2"/><path d="M3 9.5h18" stroke="currentColor" stroke-width="2"/></svg>
      All Events
    </button>
    <button class="chip" data-filter="high"><span class="dot high"></span> High Impact</button>
    <button class="chip" data-filter="medium"><span class="dot medium"></span> Medium Impact</button>
    <button class="chip" data-filter="low"><span class="dot low"></span> Low Impact</button>
  </div>

  <div class="table-wrap">
    <div class="table-head">
      <span class="col-time">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Time
      </span>
      <span class="col-event">Event</span>
      <span class="col-num">Actual</span>
      <span class="col-num">Forecast</span>
      <span class="col-num">Previous</span>
    </div>
    <div class="rows" id="rows"></div>
  </div>

  <div class="footer">
    <div class="tz">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M3 12h18M12 3c2.5 2.5 2.5 15.5 0 18M12 3c-2.5 2.5-2.5 15.5 0 18" stroke="currentColor" stroke-width="1.8"/></svg>
      Time Zone&nbsp;<b>UTC +3:30</b>
    </div>
    <div class="legend">
      <span class="legend-item"><span class="dot" style="background:var(--red)"></span>High</span>
      <span class="legend-item"><span class="dot" style="background:var(--orange)"></span>Medium</span>
      <span class="legend-item"><span class="dot" style="background:var(--green)"></span>Low</span>
    </div>
  </div>

  <div class="sheet-backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <h2>Filter by currency</h2>
    <div class="ccy-list" id="ccyList"></div>
    <button class="sheet-close" id="sheetClose">Apply</button>
  </div>

<script>
  // ---------- Telegram init ----------
  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.setBackgroundColor('#0A0814'); } catch (e) {}
    try { tg.setHeaderColor('#0A0814'); } catch (e) {}
  }
  function haptic() { if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light'); }

  // ---------- Mock data ----------
  const days = [
    { dow: 'WED', date: 22, mon: 'May' },
    { dow: 'THU', date: 23, mon: 'May' },
    { dow: 'FRI', date: 24, mon: 'May' },
    { dow: 'SAT', date: 25, mon: 'May', selected: true },
    { dow: 'SUN', date: 26, mon: 'May' },
    { dow: 'MON', date: 27, mon: 'May' },
    { dow: 'TUE', date: 28, mon: 'May' },
  ];

  const starSVG = (filled) => filled
    ? '<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.7 1.3 6.8L12 17.8 5.9 21l1.4-6.8-5-4.7 6.8-.8L12 2.5z"/></svg>'
    : '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.7 1.3 6.8L12 17.8 5.9 21l1.4-6.8-5-4.7 6.8-.8L12 2.5z"/></svg>';

  const bellSVG = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.7 21a2 2 0 01-3.4 0" stroke-linecap="round"/></svg>';

  const events = [
    { time: '15:30', flag: '🇺🇸', ccy: 'USD', name: 'Core PCE Price Index (MoM)', impact: 'high', period: 'May', actual: '0.3%', forecast: '0.2%', previous: '0.3%', tone: 'down' },
    { time: '15:30', flag: '🇺🇸', ccy: 'USD', name: 'PCE Price Index (MoM)', impact: 'high', period: 'May', actual: '0.2%', forecast: '0.3%', previous: '0.3%', tone: 'up' },
    { time: '16:45', flag: '🇺🇸', ccy: 'USD', name: 'Chicago PMI', impact: 'medium', period: 'May', actual: '47.1', forecast: '45.0', previous: '43.6', tone: 'up' },
    { time: '17:00', flag: '🇺🇸', ccy: 'USD', name: 'Consumer Sentiment', impact: 'medium', period: 'May', actual: '67.4', forecast: '66.0', previous: '65.3', tone: 'up' },
    { time: '21:00', flag: '🇺🇸', ccy: 'USD', name: 'Fed Chair Powell Speaks', impact: 'high', period: '', actual: '—', forecast: '—', previous: '—', tone: 'dim' },
    { time: '02:50', flag: '🇯🇵', ccy: 'JPY', name: 'Tokyo CPI (YoY)', impact: 'low', period: 'May', actual: '2.2%', forecast: '2.1%', previous: '1.9%', tone: 'up' },
    { time: '04:30', flag: '🇦🇺', ccy: 'AUD', name: 'Retail Sales (MoM)', impact: 'medium', period: 'Apr', actual: '0.3%', forecast: '0.2%', previous: '0.0%', tone: 'up' },
  ];

  const impactMeta = {
    high: { label: 'High Impact', color: 'var(--red)' },
    medium: { label: 'Medium Impact', color: 'var(--orange)' },
    low: { label: 'Low Impact', color: 'var(--green)' },
  };

  // ---------- State ----------
  const starred = new Set();
  const muted = new Set();
  let activeFilter = 'all';
  let activeCurrencies = new Set(['USD', 'JPY', 'AUD']);

  // ---------- Render day strip ----------
  const dayStrip = document.getElementById('dayStrip');
  days.forEach((d, i) => {
    const btn = document.createElement('button');
    btn.className = 'day-cell' + (d.selected ? ' selected' : '');
    btn.innerHTML = '<span class="dow">' + d.dow + '</span><span class="date">' + d.date + '</span><span class="mon">' + d.mon + '</span><span class="dot"></span>';
    btn.onclick = () => {
      document.querySelectorAll('.day-cell').forEach((c) => c.classList.remove('selected'));
      btn.classList.add('selected');
      haptic();
    };
    dayStrip.appendChild(btn);
  });
  const jumpBtn = document.createElement('div');
  jumpBtn.className = 'day-jump';
  jumpBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 9.5h18"/><path d="M8 3v3M16 3v3" stroke-linecap="round"/></svg>';
  dayStrip.appendChild(jumpBtn);

  // ---------- Render rows ----------
  const rowsEl = document.getElementById('rows');

  function toneClass(tone) {
    if (tone === 'up') return 'up';
    if (tone === 'down') return 'down';
    return 'dim';
  }

  function renderRows() {
    rowsEl.innerHTML = '';
    events.forEach((ev, idx) => {
      const visible = (activeFilter === 'all' || activeFilter === ev.impact) && activeCurrencies.has(ev.ccy);
      const row = document.createElement('div');
      row.className = 'row' + (visible ? '' : ' hidden');
      row.style.setProperty('--bar-color', impactMeta[ev.impact].color);

      const star = document.createElement('button');
      star.className = 'star-btn' + (starred.has(idx) ? ' active' : '');
      star.innerHTML = starSVG(starred.has(idx));
      star.onclick = () => {
        starred.has(idx) ? starred.delete(idx) : starred.add(idx);
        haptic();
        renderRows();
      };

      const timeCol = document.createElement('div');
      timeCol.className = 'time-col';
      timeCol.innerHTML = '<span class="time">' + ev.time + '</span><span class="ccy">' + ev.flag + ' ' + ev.ccy + '</span>';

      const eventCol = document.createElement('div');
      eventCol.className = 'event-col';
      const badges = '<span class="badge ' + ev.impact + '">' + impactMeta[ev.impact].label + '</span>' +
        (ev.period ? '<span class="badge period">' + ev.period + '</span>' : '');
      eventCol.innerHTML = '<span class="name">' + ev.name + '</span><div class="badges">' + badges + '</div>';

      const actual = document.createElement('div');
      actual.className = 'num-col ' + toneClass(ev.tone);
      actual.textContent = ev.actual;

      const forecast = document.createElement('div');
      forecast.className = 'num-col dim';
      forecast.textContent = ev.forecast;

      const previous = document.createElement('div');
      previous.className = 'num-col dim';
      previous.textContent = ev.previous;

      const bell = document.createElement('button');
      bell.className = 'bell-btn' + (muted.has(idx) ? ' muted' : '');
      bell.innerHTML = bellSVG;
      bell.onclick = () => {
        muted.has(idx) ? muted.delete(idx) : muted.add(idx);
        haptic();
        renderRows();
      };

      row.appendChild(star);
      row.appendChild(timeCol);
      row.appendChild(eventCol);
      row.appendChild(actual);
      row.appendChild(forecast);
      row.appendChild(previous);
      row.appendChild(bell);
      rowsEl.appendChild(row);
    });
  }

  // ---------- Filter chips ----------
  document.querySelectorAll('.chip').forEach((chip) => {
    chip.onclick = () => {
      document.querySelectorAll('.chip').forEach((c) => c.classList.remove('active'));
      chip.classList.add('active');
      activeFilter = chip.dataset.filter;
      haptic();
      renderRows();
    };
  });

  // ---------- Currency filter sheet ----------
  const allCurrencies = ['USD', 'JPY', 'AUD', 'EUR', 'GBP'];
  const ccyList = document.getElementById('ccyList');
  allCurrencies.forEach((c) => {
    const opt = document.createElement('button');
    opt.className = 'ccy-opt' + (activeCurrencies.has(c) ? ' active' : '');
    opt.textContent = c;
    opt.onclick = () => {
      if (activeCurrencies.has(c)) activeCurrencies.delete(c); else activeCurrencies.add(c);
      opt.classList.toggle('active');
      haptic();
    };
    ccyList.appendChild(opt);
  });

  const sheet = document.getElementById('sheet');
  const backdrop = document.getElementById('backdrop');
  document.getElementById('filterBtn').onclick = () => {
    sheet.classList.add('open');
    backdrop.classList.add('open');
  };
  function closeSheet() {
    sheet.classList.remove('open');
    backdrop.classList.remove('open');
    renderRows();
  }
  document.getElementById('sheetClose').onclick = closeSheet;
  backdrop.onclick = closeSheet;

  // ---------- Boot ----------
  renderRows();
</script>
</body>
</html>
