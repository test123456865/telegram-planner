<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Planner</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3F1EA;
    --surface: #FFFFFF;
    --ink: #1C1F1D;
    --ink-soft: #767F76;
    --ink-faint: #A7AEA6;
    --line: #E6E2D6;
    --accent: #1F9D8C;
    --accent-dark: #157A6D;
    --accent-soft: #DCEFEC;
    --amber: #E08D3C;
    --amber-soft: #FBEBD8;
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 12px;
    --shadow: 0 8px 24px rgba(28, 31, 29, 0.06);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    height: 100%;
    overscroll-behavior-y: none;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
  }

  .serif { font-family: 'Fraunces', Georgia, serif; }

  /* ---------- Hero ---------- */
  .hero {
    padding: 26px 20px 20px;
    background: linear-gradient(160deg, var(--accent) 0%, var(--accent-dark) 100%);
    color: #fff;
    border-radius: 0 0 28px 28px;
  }

  .hero .greeting {
    font-size: 13px;
    opacity: 0.85;
    margin: 0 0 6px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }

  .hero h1 {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 600;
    margin: 0 0 18px;
    line-height: 1.25;
  }

  .progress-card {
    background: rgba(255,255,255,0.14);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    backdrop-filter: blur(6px);
  }

  .progress-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }

  .progress-top .label { font-size: 13px; opacity: 0.9; font-weight: 500; }
  .progress-top .count { font-size: 13px; font-weight: 700; }

  .progress-track {
    height: 8px;
    border-radius: 8px;
    background: rgba(255,255,255,0.25);
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: #fff;
    border-radius: 8px;
    transition: width 0.4s cubic-bezier(.34,1.56,.64,1);
  }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex;
    gap: 6px;
    margin: -18px 20px 0;
    background: var(--surface);
    border-radius: var(--radius-md);
    padding: 5px;
    box-shadow: var(--shadow);
    position: relative;
    z-index: 2;
  }

  .tab {
    flex: 1;
    background: none;
    border: none;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    color: var(--ink-soft);
    padding: 11px 0;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: color 0.2s;
    position: relative;
  }

  .tab.active { color: #fff; }

  .tab-indicator {
    position: absolute;
    top: 5px;
    bottom: 5px;
    width: calc(50% - 5px);
    background: var(--ink);
    border-radius: var(--radius-sm);
    transition: transform 0.28s cubic-bezier(.34,1.56,.64,1);
    z-index: -1;
  }

  /* ---------- Main ---------- */
  main {
    flex: 1;
    padding: 22px 20px 110px;
    overflow-y: auto;
  }

  .view { display: none; }
  .view.active { display: block; animation: fadeIn 0.25s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .section-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin: 0 2px 10px;
  }

  /* ---------- Task rows ---------- */
  .card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 16px 16px;
    border-bottom: 1px solid var(--line);
  }

  .row:last-child { border-bottom: none; }

  .check {
    width: 25px;
    height: 25px;
    min-width: 25px;
    border-radius: 50%;
    border: 2px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.18s, border-color 0.18s, transform 0.18s;
  }

  .check.done {
    background: var(--accent);
    border-color: var(--accent);
    transform: scale(1.06);
  }

  .check svg {
    width: 13px;
    height: 13px;
    opacity: 0;
    transition: opacity 0.15s;
  }

  .check.done svg { opacity: 1; }

  .row-text {
    flex: 1;
    font-size: 15px;
    font-weight: 500;
    line-height: 1.4;
    transition: color 0.15s;
  }

  .row-text.done {
    color: var(--ink-faint);
    text-decoration: line-through;
    text-decoration-color: var(--ink-faint);
    text-decoration-thickness: 1.5px;
  }

  .row-del {
    background: none;
    border: none;
    color: var(--ink-faint);
    font-size: 18px;
    line-height: 1;
    padding: 6px;
    cursor: pointer;
    border-radius: 50%;
  }

  /* ---------- Habit cards ---------- */
  .habit-card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 18px 18px 16px;
    margin-bottom: 14px;
  }

  .habit-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .habit-name {
    font-size: 16px;
    font-weight: 700;
    margin: 0 0 4px;
  }

  .habit-streak {
    font-size: 12.5px;
    color: var(--amber);
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .habit-streak.zero { color: var(--ink-faint); }

  .today-btn {
    width: 46px;
    height: 46px;
    min-width: 46px;
    border-radius: 50%;
    border: 2px solid var(--line);
    background: var(--surface);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.18s;
  }

  .today-btn.done {
    background: var(--accent);
    border-color: var(--accent);
    transform: scale(1.05);
  }

  .today-btn svg { width: 19px; height: 19px; opacity: 0; transition: opacity 0.15s; }
  .today-btn.done svg { opacity: 1; }

  .habit-days {
    display: flex;
    justify-content: space-between;
    gap: 4px;
  }

  .day-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    flex: 1;
  }

  .day-label {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--ink-faint);
    text-transform: uppercase;
  }

  .day-bar {
    width: 100%;
    max-width: 26px;
    height: 26px;
    border-radius: 8px;
    background: var(--line);
  }

  .day-bar.filled { background: var(--accent); }
  .day-bar.today-outline { box-shadow: 0 0 0 2px var(--accent-dark); }

  /* ---------- Empty states ---------- */
  .empty {
    text-align: center;
    padding: 50px 20px 10px;
    color: var(--ink-soft);
  }

  .empty .emoji { font-size: 34px; margin-bottom: 12px; }
  .empty .title { font-size: 15.5px; color: var(--ink); font-weight: 700; margin-bottom: 4px; }
  .empty .sub { font-size: 13.5px; color: var(--ink-soft); }

  /* ---------- FAB ---------- */
  .fab {
    position: fixed;
    bottom: calc(22px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 30px;
    padding: 15px 28px;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 10px 26px rgba(28, 31, 29, 0.28);
    cursor: pointer;
  }

  .fab .plus { color: var(--accent); font-size: 17px; }

  /* ---------- Sheet ---------- */
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(20, 22, 20, 0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 10;
  }

  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--surface);
    border-radius: 26px 26px 0 0;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(.32,.72,0,1);
    z-index: 11;
  }

  .sheet.open { transform: translateY(0); }

  .sheet-handle {
    width: 36px;
    height: 4px;
    border-radius: 4px;
    background: var(--line);
    margin: 0 auto 18px;
  }

  .sheet h2 {
    font-family: 'Fraunces', serif;
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 16px;
  }

  .sheet input {
    width: 100%;
    border: 2px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 14px 15px;
    font-family: inherit;
    font-size: 15px;
    background: var(--bg);
    color: var(--ink);
  }

  .sheet input:focus { outline: none; border-color: var(--accent); }

  .sheet-actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }

  .sheet-actions button {
    flex: 1;
    padding: 14px;
    border-radius: var(--radius-sm);
    border: none;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
  }

  .btn-cancel { background: var(--bg); color: var(--ink-soft); border: 2px solid var(--line) !important; }
  .btn-confirm { background: var(--accent); color: #fff; }
</style>
</head>
<body>

  <div class="hero">
    <p class="greeting" id="greeting">GOOD MORNING</p>
    <h1 class="serif" id="dateLabel">Loading...</h1>
    <div class="progress-card">
      <div class="progress-top">
        <span class="label" id="progressLabel">No tasks yet</span>
        <span class="count" id="progressCount"></span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab-indicator" id="tabIndicator"></div>
    <button class="tab active" data-tab="todo">Tasks</button>
    <button class="tab" data-tab="habits">Habits</button>
  </div>

  <main>
    <div class="view active" id="view-todo">
      <p class="section-label">Your tasks</p>
      <div class="card" id="todoCard" style="display:none">
        <div id="todoList"></div>
      </div>
      <div class="empty" id="todoEmpty">
        <div class="emoji">📝</div>
        <div class="title">No tasks yet</div>
        <div class="sub">Tap the button below to add your first one</div>
      </div>
    </div>

    <div class="view" id="view-habits">
      <p class="section-label">Building habits</p>
      <div id="habitList"></div>
      <div class="empty" id="habitEmpty">
        <div class="emoji">🌱</div>
        <div class="title">No habits yet</div>
        <div class="sub">Add something you want to do every day</div>
      </div>
    </div>
  </main>

  <button class="fab" id="fabAdd"><span class="plus">+</span> Add</button>

  <div class="sheet-backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <h2 id="sheetTitle">New task</h2>
    <input type="text" id="sheetInput" placeholder="e.g. Buy groceries">
    <div class="sheet-actions">
      <button class="btn-cancel" id="sheetCancel">Cancel</button>
      <button class="btn-confirm" id="sheetConfirm">Add</button>
    </div>
  </div>

<script>
  // ---------- Telegram init ----------
  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.setBackgroundColor('#F3F1EA'); } catch (e) {}
    try { tg.setHeaderColor('#1F9D8C'); } catch (e) {}
  }

  function haptic(type) {
    if (tg && tg.HapticFeedback) {
      if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
      else tg.HapticFeedback.impactOccurred('light');
    }
  }

  // ---------- Storage layer ----------
  const storage = {
    get(key) {
      return new Promise((resolve) => {
        if (tg && tg.CloudStorage) {
          tg.CloudStorage.getItem(key, (err, value) => resolve(err ? null : value));
        } else {
          resolve(localStorage.getItem(key));
        }
      });
    },
    set(key, value) {
      return new Promise((resolve) => {
        if (tg && tg.CloudStorage) {
          tg.CloudStorage.setItem(key, value, () => resolve());
        } else {
          localStorage.setItem(key, value);
          resolve();
        }
      });
    }
  };

  // ---------- Date helpers ----------
  function isoDate(d) { return d.toISOString().slice(0, 10); }
  const todayISO = isoDate(new Date());
  const dayLabels = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
  const checkSVG = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 12L13 4" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  const now = new Date();
  const hour = now.getHours();
  document.getElementById('greeting').textContent =
    hour < 12 ? 'GOOD MORNING' : hour < 18 ? 'GOOD AFTERNOON' : 'GOOD EVENING';
  document.getElementById('dateLabel').textContent = now.toLocaleDateString('en-US', {
    weekday: 'long', day: 'numeric', month: 'long'
  });

  // ---------- State ----------
  let todos = [];
  let habits = [];
  let activeTab = 'todo';

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  async function loadAll() {
    const t = await storage.get('todos');
    const h = await storage.get('habits');
    todos = t ? JSON.parse(t) : [];
    habits = h ? JSON.parse(h) : [];
    renderTodos();
    renderHabits();
  }

  function saveTodos() { storage.set('todos', JSON.stringify(todos)); }
  function saveHabits() { storage.set('habits', JSON.stringify(habits)); }

  // ---------- Progress hero ----------
  function renderProgress() {
    const total = todos.length;
    const done = todos.filter((t) => t.done).length;
    const label = document.getElementById('progressLabel');
    const count = document.getElementById('progressCount');
    const fill = document.getElementById('progressFill');

    if (total === 0) {
      label.textContent = 'No tasks yet';
      count.textContent = '';
      fill.style.width = '0%';
      return;
    }
    const pct = Math.round((done / total) * 100);
    label.textContent = done === total ? 'All done for today 🎉' : "Today's progress";
    count.textContent = done + ' / ' + total;
    fill.style.width = pct + '%';
  }

  // ---------- Todo rendering ----------
  function renderTodos() {
    const list = document.getElementById('todoList');
    const card = document.getElementById('todoCard');
    const empty = document.getElementById('todoEmpty');
    list.innerHTML = '';

    if (todos.length === 0) {
      card.style.display = 'none';
      empty.style.display = 'block';
      renderProgress();
      return;
    }
    card.style.display = 'block';
    empty.style.display = 'none';

    const sorted = [...todos].sort((a, b) => (a.done === b.done ? 0 : a.done ? 1 : -1));

    sorted.forEach((item) => {
      const row = document.createElement('div');
      row.className = 'row';

      const check = document.createElement('div');
      check.className = 'check' + (item.done ? ' done' : '');
      check.innerHTML = checkSVG;
      check.onclick = () => {
        item.done = !item.done;
        haptic(item.done ? 'success' : 'light');
        saveTodos();
        renderTodos();
      };

      const text = document.createElement('div');
      text.className = 'row-text' + (item.done ? ' done' : '');
      text.textContent = item.text;

      const del = document.createElement('button');
      del.className = 'row-del';
      del.textContent = '×';
      del.onclick = () => {
        todos = todos.filter((t) => t.id !== item.id);
        saveTodos();
        renderTodos();
      };

      row.appendChild(check);
      row.appendChild(text);
      row.appendChild(del);
      list.appendChild(row);
    });

    renderProgress();
  }

  // ---------- Habit rendering ----------
  function lastSevenDays() {
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      days.push(d);
    }
    return days;
  }

  function computeStreak(habit) {
    let streak = 0;
    let cursor = new Date();
    while (habit.done.includes(isoDate(cursor))) {
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    }
    return streak;
  }

  function renderHabits() {
    const list = document.getElementById('habitList');
    const empty = document.getElementById('habitEmpty');
    list.innerHTML = '';
    if (habits.length === 0) {
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    const days = lastSevenDays();

    habits.forEach((habit) => {
      const card = document.createElement('div');
      card.className = 'habit-card';

      const top = document.createElement('div');
      top.className = 'habit-top';

      const left = document.createElement('div');
      const name = document.createElement('p');
      name.className = 'habit-name';
      name.textContent = habit.name;
      const s = computeStreak(habit);
      const streak = document.createElement('div');
      streak.className = 'habit-streak' + (s === 0 ? ' zero' : '');
      streak.textContent = s > 0 ? '🔥 ' + s + ' day streak' : 'Start today';
      left.appendChild(name);
      left.appendChild(streak);

      const todayFilled = habit.done.includes(todayISO);
      const todayBtn = document.createElement('div');
      todayBtn.className = 'today-btn' + (todayFilled ? ' done' : '');
      todayBtn.innerHTML = checkSVG;
      todayBtn.onclick = () => {
        if (todayFilled) {
          habit.done = habit.done.filter((x) => x !== todayISO);
        } else {
          habit.done.push(todayISO);
          haptic('success');
        }
        saveHabits();
        renderHabits();
      };

      top.appendChild(left);
      top.appendChild(todayBtn);

      const daysWrap = document.createElement('div');
      daysWrap.className = 'habit-days';

      days.forEach((d) => {
        const iso = isoDate(d);
        const isToday = iso === todayISO;
        const filled = habit.done.includes(iso);

        const col = document.createElement('div');
        col.className = 'day-col';

        const label = document.createElement('div');
        label.className = 'day-label';
        label.textContent = dayLabels[d.getDay()];

        const bar = document.createElement('div');
        bar.className = 'day-bar' + (filled ? ' filled' : '') + (isToday ? ' today-outline' : '');

        col.appendChild(label);
        col.appendChild(bar);
        daysWrap.appendChild(col);
      });

      card.appendChild(top);
      card.appendChild(daysWrap);
      list.appendChild(card);
    });
  }

  // ---------- Tabs ----------
  const tabIndicator = document.getElementById('tabIndicator');
  document.querySelectorAll('.tab').forEach((btn, i) => {
    btn.onclick = () => {
      activeTab = btn.dataset.tab;
      document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('active', b === btn));
      tabIndicator.style.transform = i === 0 ? 'translateX(0)' : 'translateX(100%)';
      document.getElementById('view-todo').classList.toggle('active', activeTab === 'todo');
      document.getElementById('view-habits').classList.toggle('active', activeTab === 'habits');
    };
  });

  // ---------- Add sheet ----------
  const sheet = document.getElementById('sheet');
  const backdrop = document.getElementById('backdrop');
  const sheetInput = document.getElementById('sheetInput');
  const sheetTitle = document.getElementById('sheetTitle');
  const sheetConfirmBtn = document.getElementById('sheetConfirm');

  function openSheet() {
    sheetTitle.textContent = activeTab === 'todo' ? 'New task' : 'New habit';
    sheetInput.placeholder = activeTab === 'todo' ? 'e.g. Buy groceries' : 'e.g. Drink more water';
    sheetConfirmBtn.textContent = activeTab === 'todo' ? 'Add Task' : 'Add Habit';
    sheetInput.value = '';
    sheet.classList.add('open');
    backdrop.classList.add('open');
    setTimeout(() => sheetInput.focus(), 150);
  }

  function closeSheet() {
    sheet.classList.remove('open');
    backdrop.classList.remove('open');
  }

  document.getElementById('fabAdd').onclick = openSheet;
  document.getElementById('sheetCancel').onclick = closeSheet;
  backdrop.onclick = closeSheet;

  function confirmAdd() {
    const value = sheetInput.value.trim();
    if (!value) return;
    if (activeTab === 'todo') {
      todos.push({ id: uid(), text: value, done: false });
      saveTodos();
      renderTodos();
    } else {
      habits.push({ id: uid(), name: value, done: [] });
      saveHabits();
      renderHabits();
    }
    haptic('light');
    closeSheet();
  }

  sheetConfirmBtn.onclick = confirmAdd;
  sheetInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') confirmAdd();
  });

  // ---------- Boot ----------
  loadAll();
</script>
</body>
</html>
